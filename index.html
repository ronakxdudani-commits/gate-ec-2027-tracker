<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Loading GATE EC 2027 tracker...</title></head>
<body>
<div id="status">Loading full tracker...</div>
<script>
async function load() {
  const parts = ['part0.html', 'part1.html', 'part2.html', 'part3.html'];
  let full = '';
  for (const p of parts) {
    const r = await fetch(p);
    if (!r.ok) { document.getElementById('status').textContent = 'Failed to load ' + p; return; }
    full += await r.text();
  }
  document.open();
  document.write(full);
  document.close();
}
load();
</script>
</body>
</html>
